<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예약 관리 | 포트폴리오 관리자</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- 절대경로(/admin/...)로 씁니다. index.html 과 같은 이유입니다. -->
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- ==================== 로그인 화면 ==================== -->
  <div class="login-screen" id="login-screen" hidden>
    <form class="login-card" id="login-form">
      <h1 class="login-title">
        <i class="fa-solid fa-lock"></i>
        포트폴리오 관리자
      </h1>
      <p class="login-desc">예약 현황을 보려면 비밀번호를 입력하세요.</p>

      <label class="field">
        <span class="field-label">비밀번호</span>
        <input type="password" id="login-password" class="input"
               placeholder="관리자 비밀번호를 입력하세요"
               autocomplete="current-password" required autofocus>
      </label>

      <p class="field-error" id="login-error" hidden></p>

      <button type="submit" class="btn btn-primary btn-block">
        <i class="fa-solid fa-right-to-bracket"></i> 로그인
      </button>

      <a class="login-back" href="/">
        <i class="fa-solid fa-arrow-left"></i> 사이트로 돌아가기
      </a>
    </form>
  </div>

  <!-- ==================== 관리 화면 ==================== -->
  <div class="workspace" id="workspace" hidden>

    <header class="topbar">
      <div class="topbar-left">
        <i class="fa-regular fa-calendar-check"></i>
        <h1>예약 관리</h1>
      </div>
      <div class="topbar-right">
        <a class="btn btn-ghost" href="/admin/">
          <i class="fa-solid fa-folder-tree"></i> 프로젝트 관리
        </a>
        <a class="btn btn-ghost" href="/" target="_blank" rel="noopener">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> 사이트 보기
        </a>
        <button type="button" class="btn btn-ghost" id="btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
        </button>
      </div>
    </header>

    <main class="rsv-layout">
      <section class="panel">
        <div class="panel-head">
          <h2>방문 예약 <span class="count" id="reservation-count">0</span></h2>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-refresh">
            <i class="fa-solid fa-rotate-right"></i> 새로고침
          </button>
        </div>

        <div class="reservation-table-wrap">
          <table class="reservation-table">
            <thead>
              <tr>
                <th>예약 번호</th>
                <th>신청자 / 이메일</th>
                <th>방문 희망 시간</th>
                <th>방문 목적</th>
                <th>처리 상태</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="reservation-table-body"></tbody>
          </table>
        </div>

        <div class="list-empty" id="reservation-empty" hidden>
          <i class="fa-regular fa-calendar"></i>
          아직 들어온 예약이 없습니다.
        </div>
      </section>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/admin/js/reservationsAdmin.js"></script>
</body>
</html>
